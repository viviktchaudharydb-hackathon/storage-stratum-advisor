    <line x1="420" y1="257" x2="420" y2="267"/>
    <line x1="420" y1="299" x2="420" y2="309"/>
    <line x1="420" y1="341" x2="420" y2="351"/>
    <line x1="420" y1="383" x2="420" y2="393"/>
