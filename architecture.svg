    <text x="975" y="245" text-anchor="middle">(decision telemetry)</text>
    <text x="975" y="275" text-anchor="middle">Vertex AI RAG Engine</text>
    <text x="975" y="305" text-anchor="middle">CMDB / ServiceNow</text>
    <text x="975" y="320" text-anchor="middle">registry feed</text>
